# fly.toml for nba-pickem (generated by `fly launch`, then adjusted).
# See https://fly.io/docs/reference/configuration/

app = 'nba-pickem'
primary_region = 'ams'

[build]

[env]
  DATA_DIR = '/data'
  PORT = '3000'

# The JSON file on this volume is the database: it holds every join, pick and lock.
# Run exactly one machine, or each machine keeps its own copy.
[[mounts]]
  source = 'pickem_data'
  destination = '/data'

[http_service]
  internal_port = 3000   # must match PORT above
  force_https = true
  auto_stop_machines = 'off'   # never sleep: keeps live updates connected
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/state'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
