# fly.toml app configuration file generated for nba-pickem on 2026-10-19T00:46:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nba-pickem'
primary_region = 'ams'

[build]

[env]
  DATA_DIR = '/data'
  PORT = '3000'

[[mounts]]
  source = 'pickem_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/state'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
